[project]
name = "pg-inspector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ALOUANI YOUSSEF", email = "alouaniyoussef.dev@gmail.com" }
]
module-root = ""
module-name = "src"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "mcp>=2.3.0",
    "pglast>=8.7",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
start = "src.main:main"
test = "src.testing:main"
mock-activity = "src.mock_activity:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
